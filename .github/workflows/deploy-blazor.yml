name: Deploy Blazor WASM to GitHub Pages

# Builds, tests and deploys the Morph.Web converter (src/Morph.Web) to GitHub Pages. This is
# independent of the container-based rendering suite in test.yml. The web projects are in Morph.slnx
# but excluded from Release solution builds (a Blazor WASM project can't build in the linux/amd64 test
# image, which has no wasm-tools workload), so they're built here by path instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # SponsorCheck (referenced by Morph/Morph.ImageSharp/Morph.Pdf) is for the nuget pack builds and
    # needs a GitHub credential this deploy has no reason to hold. The csprojs already drop the
    # SponsorCheck reference when MORPH_TEST_CONTAINER=1 (the flag the linux/amd64 test container sets for
    # its compile-and-test-only build). This deploy is the same shape — it compiles, tests and publishes
    # the web app but never packs — so reuse that gate. It has no runtime effect on Morph.
    env:
      MORPH_TEST_CONTAINER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # A Release publish relinks the WASM runtime with emcc (native-asset size optimisation), which
      # lives in the wasm-tools workload. Without it the publish falls back to the prebuilt runtime —
      # still correct, just larger — so installing it keeps the deployed bundle lean.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build tests (also publishes the Blazor app for snapshot tests)
        run: dotnet build src/Morph.Web.Tests --configuration Release

      # TUnit ships as an executable on Microsoft.Testing.Platform; run it directly rather than via
      # `dotnet test`, which rejects it under the VSTest path. The ModuleInitializer installs the
      # Playwright browser (VerifyPlaywright.Initialize(installPlaywright: true)) on first run.
      - name: Run tests
        run: dotnet src/Morph.Web.Tests/bin/Release/net10.0/Morph.Web.Tests.dll

      - name: Publish
        run: dotnet publish src/Morph.Web --configuration Release --output publish

      # The site is served at the root of the custom domain (morph.papyrine.org), so the
      # published <base href="/" /> is already correct — no subpath rewrite. (When it was served
      # from the GitHub Pages project subpath https://papyrine.github.io/Morph/, this step rewrote
      # the base to "/Morph/"; the custom domain made that rewrite wrong.)

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll

      - name: Copy index.html to 404.html for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
