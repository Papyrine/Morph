name: Deploy GH Pages

# Builds, tests and deploys the Morph.Web app (src/Morph.Web) to GitHub Pages. This is independent of
# the container-based rendering suite in build.yml. Morph.Web and Morph.Web.Tests are in Morph.slnx but
# excluded from Release solution builds (a Blazor WASM project can't build in the linux/amd64 test
# image, which has no wasm-tools workload), so they're built here by path instead. The converter itself
# lives in src/Morph.Blazor, a plain Razor class library that has no such restriction — it builds and
# packs with the rest of the solution, and arrives here as a project reference of the app.

#
# The web tests run on Windows only, in a job of their own. They are browser tests, and their
# screenshot snapshots are recorded on Windows: they assert on what the app does in a browser, which
# another OS adds nothing to. The build job publishes on Linux, and the deploy waits for both.
#
# What is deployed is compiled ahead of time (RunAOTCompilation, on the publish line below and nowhere
# else). The editor's edits run 4–5x faster AOT, at the price of a ~8 MB larger first download (gzip,
# which is what Pages serves; ~23 MB before the rooted libraries were left interpreted, which an iPhone
# could not boot), a 1.3 s rather than 0.6 s boot from cache, and a publish of 15–25 minutes
# instead of one — so only pushes to main and manual runs pay it, and a pull request publishes
# interpreted. The csproj never turns it on: Morph.Web.Tests publishes the app on every build, and every
# local test build would become an AOT publish. The workarounds AOT needs live in Morph.Blazor's
# build/Morph.Blazor.targets. The test job therefore runs the interpreted build; the test-aot job runs
# the same browser tests against the AOT app the build job made, and the deploy waits for it too.
#
# A pull request runs the build and test jobs only — compile, test and publish, with no Pages upload
# and no deploy. Nothing else compiles Morph.Web.Tests, so without that a change to a type its tests
# stub (an interface in Morph, say) first fails here, on main, after the merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue behind one another and are never cancelled. A pull request gets a group of its own,
# so it neither waits on a deploy nor holds one up, and a new push supersedes its previous run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    # As the build job below: no SponsorCheck credential is needed to compile and test.
    env:
      MORPH_TEST_CONTAINER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The app builds native (WasmBuildNative) to link Krilla's PDF archive into its .wasm, which needs
      # the wasm-tools workload.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build tests (also publishes the Blazor app for snapshot tests)
        run: dotnet build src/Morph.Web.Tests --configuration Release

      # TUnit ships as an executable on Microsoft.Testing.Platform; run it directly rather than via
      # `dotnet test`, which rejects it under the VSTest path. The ModuleInitializer installs the
      # Playwright browser (VerifyPlaywright.Initialize(installPlaywright: true)) on first run.
      - name: Run tests
        run: dotnet src/Morph.Web.Tests/bin/Release/net11.0/Morph.Web.Tests.dll

  build:
    runs-on: ubuntu-latest
    # An AOT publish measured 12 minutes on 24 cores; on the runner's 4 it takes longer. The bound turns a
    # hung emscripten link into a failure rather than six hours of waiting.
    timeout-minutes: 60
    # SponsorCheck (referenced by every packable project — Morph, Morph.ImageSharp, Morph.Pdf,
    # Morph.Skia and Morph.Blazor) is for the nuget pack builds and
    # needs a GitHub credential this deploy has no reason to hold. The csprojs already drop the
    # SponsorCheck reference when MORPH_TEST_CONTAINER=1 (the flag the linux/amd64 test container sets for
    # its compile-and-test-only build). This deploy is the same shape — it compiles, tests and publishes
    # the web app but never packs — so reuse that gate. It has no runtime effect on Morph.
    env:
      MORPH_TEST_CONTAINER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The app builds native (WasmBuildNative) to link Krilla's PDF archive into its .wasm with emcc, and
      # an AOT publish compiles every assembly with it; both live in the wasm-tools workload. Without it
      # the build fails rather than shipping an app whose PDF export cannot load its native. emscripten
      # also needs python3, which ubuntu-latest has.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # AOT for what is deployed (pushes to main, manual runs); a pull request publishes interpreted.
      - name: Publish
        run: dotnet publish src/Morph.Web --configuration Release --output publish -p:RunAOTCompilation=${{ github.event_name != 'pull_request' }}

      # The app as published, for test-aot to run the browser tests against before it is deployed.
      - name: Upload the AOT app for test-aot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-aot
          path: publish/wwwroot
          retention-days: 1

      # The site is served at the root of the custom domain (morph.papyrine.org), so the
      # published <base href="/" /> is already correct — no subpath rewrite. (When it was served
      # from the GitHub Pages project subpath https://papyrine.github.io/Morph/, this step rewrote
      # the base to "/Morph/"; the custom domain made that rewrite wrong.)

      - name: Add .nojekyll file
        if: github.event_name != 'pull_request'
        run: touch publish/wwwroot/.nojekyll

      - name: Copy index.html to 404.html for SPA routing
        if: github.event_name != 'pull_request'
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  # The browser tests against the AOT app the build job made, which is the one deployed: the test job
  # runs them against an interpreted publish of its own. The tests are built without publishing the app
  # (SkipBlazorPublish), and serve whatever is in bin/Release/blazor-publish.
  test-aot:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: build
    env:
      MORPH_TEST_CONTAINER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Building the tests still builds Morph.Web, which on .NET 11 needs the workload even unpublished.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Download the AOT app
        uses: actions/download-artifact@v8
        with:
          name: web-aot
          path: src/Morph.Web.Tests/bin/Release/blazor-publish/wwwroot

      - name: Build tests, without publishing the app
        run: dotnet build src/Morph.Web.Tests --configuration Release -p:SkipBlazorPublish=true

      - name: Run the browser tests against the AOT app
        run: dotnet src/Morph.Web.Tests/bin/Release/net11.0/Morph.Web.Tests.dll --treenode-filter "/*/*/SnapshotTests/*"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test, test-aot]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
