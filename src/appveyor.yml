image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
init:
- pwsh: |
    if ($isWindows) {
      # pandoc + the two PDF engines the reference generator drives (typst and MiKTeX/xelatex)
      choco install pandoc typst miktex -y
      refreshenv
      # Let MiKTeX fetch LaTeX packages on first use so xelatex runs non-interactively
      try { initexmf --admin --set-config-value "[MPM]AutoInstall=1" } catch { Write-Host "MiKTeX auto-install config skipped" }
    }
    if ($isLinux) {
      sudo apt-get -yq install pandoc texlive-xetex
    }
build_script:
- pwsh: |
    Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile "./dotnet-install.ps1"
    ./dotnet-install.ps1 -JSonFile global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
- dotnet build src --configuration Release
- dotnet run --project src/Tests --configuration Release --no-build
- dotnet run --project src/StaticSettingTests --configuration Release --no-build
test: off
artifacts:
- path: nugets\**\*.nupkg
on_failure:
  - ps: |
      $root = (Get-Location).Path
      Get-ChildItem *.received.* -Recurse | % {
        $rel = $_.FullName.Substring($root.Length + 1)
        Push-AppveyorArtifact $_.FullName -FileName $rel
      }