# AppVeyor: Windows build + NuGet pack artifacts.
#
# The test suite runs in GitHub Actions inside a linux/amd64 container
# (.github/workflows/test.yml) - Verify baselines are container-flavored
# so Windows test execution would diverge from them. AppVeyor's role here
# is to confirm the solution still builds on Windows and to produce the
# release nupkgs.

image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
build_script:
- pwsh: |
    Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile "./dotnet-install.ps1"
    ./dotnet-install.ps1 -JSonFile global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
- dotnet build src --configuration Release
test: off
artifacts:
- path: nugets\**\*.nupkg
