<div class="converter">
  <div class="upload-panel">
    <label class="file-drop" for="source-file">
      <span class="file-drop-icon">📄</span>
      <span class="file-drop-text">
        <strong>Choose an Office file</strong>
        <span>Word .docx, Excel .xlsx or PowerPoint .pptx — converted to PNG, PDF, HTML, Markdown or plain text</span>
      </span>
      <input id="source-file" class="file-input" accept=".docx,.xlsx,.pptx" type="file" blazor:elementreference="scrubbed">
    </label>
    <div class="upload-or">
      <span>or</span>
    </div>
    <div class="sample-row">
      <button class="sample-btn" blazor:onclick="1">📄 Sample Word</button>
      <button class="sample-btn" blazor:onclick="2">📊 Sample Excel</button>
      <button class="sample-btn" blazor:onclick="3">📽️ Sample PowerPoint</button>
    </div>
  </div>
</div>
