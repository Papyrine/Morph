
<div class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editor-count-title" blazor:onkeydown="32">
	<h2 id="editor-count-title" class="editor-dialog-title">Word count</h2>
	<dl class="editor-count">
		<dt>Pages</dt>
		<dd>1</dd>
		<dt>Words</dt>
		<dd>9</dd>
		<dt>Characters (no spaces)</dt>
		<dd>46</dd>
		<dt>Characters (with spaces)</dt>
		<dd>52</dd>
		<dt>Paragraphs</dt>
		<dd>3</dd>
		<dt>Lines</dt>
		<dd>3</dd>
	</dl>
	<p class="editor-dialog-note">The document's body: headers, footers and notes are not counted.</p>
	<div class="editor-dialog-buttons">
		<button type="button" class="editor-button editor-button-primary" blazor:onclick="33">Close</button>
	</div>
</div>
