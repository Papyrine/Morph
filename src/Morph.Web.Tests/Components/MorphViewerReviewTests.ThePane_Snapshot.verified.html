    <div class="viewer-group viewer-group-end">

        <button type="button" class="review-action" blazor:onclick="22">Reject all</button>

      <div class="review-list" role="list">

            <p class="review-body review-comment-text">A greeting. Is it needed?</p>
          </div>
          <div class="review-reply">
            <div class="review-entry" data-comment-id="1">

                <span class="review-name">Bob</span>

            </div>
          </div>

            <button type="button" class="review-button" blazor:onclick:stoppropagation="" blazor:onclick="30">Reply</button>
            <button type="button" class="review-button" blazor:onclick:stoppropagation="" blazor:onclick="31">Resolve</button>
          </div>
        </div>
        <div class="review-card review-change" role="listitem" tabindex="0" data-review-key="change:0:0" data-kind="Insertion" blazor:onclick="32" blazor:onkeydown="33">

            <span class="review-avatar" aria-hidden="true">R</span>

                <path d="M20 6L9 17l-5-5"></path>
              </svg>

        <div class="review-card review-change" role="listitem" tabindex="0" data-review-key="change:0:1" data-kind="Deletion" blazor:onclick="36" blazor:onkeydown="37">
          <div class="review-meta">
            <span class="review-avatar" aria-hidden="true">R</span>
            <span class="review-name">Reviewer</span>
            <span class="review-date">25 Apr 2025, 10:01</span>
