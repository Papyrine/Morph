<div class="viewer" blazor:elementreference="scrubbed">
  <div class="viewer-toolbar" role="toolbar" aria-label="Document viewer">
    <div class="viewer-group viewer-group-start">
      <button type="button" class="viewer-button" title="Toggle sidebar" aria-label="Toggle sidebar" aria-pressed="false" disabled="" blazor:onclick="1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M9 3v18"></path>
          </g>
        </svg>
      </button>
      <button type="button" class="viewer-button" title="Find in document (Ctrl+F)" aria-label="Find in document" aria-keyshortcuts="Control+F" aria-pressed="false" disabled="" blazor:onclick="2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="m21 21l-4.34-4.34"></path>
            <circle cx="11" cy="11" r="8"></circle>
          </g>
        </svg>
      </button>
      <span class="viewer-title"></span>
    </div>
    <div class="viewer-group viewer-group-middle">
      <button type="button" class="viewer-button" title="Previous page" aria-label="Previous page" disabled="" blazor:onclick="3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m18 15l-6-6l-6 6"></path>
        </svg>
      </button>
      <input class="viewer-page-input" type="text" inputmode="numeric" aria-label="Page number" disabled="" value="1" blazor:onchange="4">
      <span class="viewer-page-count">of 0</span>
      <button type="button" class="viewer-button" title="Next page" aria-label="Next page" disabled="" blazor:onclick="5">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9l6 6l6-6"></path>
        </svg>
      </button>
      <span class="viewer-divider" aria-hidden="true"></span>
      <button type="button" class="viewer-button" title="Zoom out (Ctrl+-)" aria-label="Zoom out" aria-keyshortcuts="Control+-" disabled="" blazor:onclick="6">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14"></path>
        </svg>
      </button>
      <select class="viewer-zoom" aria-label="Zoom" disabled="" value="auto" blazor:onchange="7">
        <option value="auto" selected="">Automatic zoom</option>
        <option value="page-actual">Actual size</option>
        <option value="page-fit">Page fit</option>
        <option value="page-width">Page width</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
      <button type="button" class="viewer-button" title="Zoom in (Ctrl++)" aria-label="Zoom in" aria-keyshortcuts="Control++" disabled="" blazor:onclick="8">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7v14"></path>
        </svg>
      </button>
      <span class="viewer-divider" aria-hidden="true"></span>
      <button type="button" class="viewer-button" title="Rotate clockwise" aria-label="Rotate clockwise" disabled="" blazor:onclick="9">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
          </g>
        </svg>
      </button>
    </div>
    <div class="viewer-group viewer-group-end">
      <label class="viewer-button viewer-open" title="Open file (Ctrl+O)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span class="viewer-hidden-label">Open file</span>
        <input class="file-input" accept=".docx,.xlsx,.pptx" aria-label="Open file" type="file" blazor:elementreference="scrubbed">
      </label>
      <button type="button" class="viewer-button" data-viewer-action="presentation" title="Presentation mode" aria-label="Presentation mode" aria-pressed="false" disabled="">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 3h20m-1 0v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3m4 18l5-5l5 5"></path>
        </svg>
      </button>
      <button type="button" class="viewer-button" title="Print (Ctrl+P)" aria-label="Print" aria-keyshortcuts="Control+P" disabled="" blazor:onclick="10">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"></path>
            <rect width="12" height="8" x="6" y="14" rx="1"></rect>
          </g>
        </svg>
      </button>
      <button type="button" class="viewer-button" title="Download (Ctrl+S)" aria-label="Download" aria-keyshortcuts="Control+S" disabled="" blazor:onclick="11">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <path d="m7 10l5 5l5-5"></path>
          </g>
        </svg>
      </button>
    </div>
  </div>
  <div class="viewer-body">
    <div class="viewer-sidebar" role="navigation" aria-label="Page thumbnails">
      <div class="viewer-thumbs"></div>
    </div>
    <div class="viewer-main">
      <div class="viewer-pages" tabindex="0" role="region" aria-label="Document"></div>
      <div class="viewer-empty">
        <p class="viewer-empty-title">Open a Word, Excel or PowerPoint file</p>
        <p class="viewer-empty-note">.docx, .xlsx or .pptx — shown right here, with selectable text. Nothing leaves this device.</p>
        <button type="button" class="viewer-empty-open" data-viewer-action="open">Choose a file</button>
        <p class="viewer-empty-note">or drop one anywhere on the viewer</p>
      </div>
    </div>
  </div>
</div>
