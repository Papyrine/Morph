<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morph — Office Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <base href="/" />
    <!-- Preload critical resources -->
    <link rel="preload" href="_content/Morph.Blazor/morph.css" as="style" />
    <link rel="preload" href="css/app.css" as="style" />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="preload" href="js/interop.js" as="script" />
    <!-- The four Aptos faces every render needs (~940KB, see Morph.Blazor's FontStore). Fetched by
         HttpClient once the app is running, which is well after the runtime has finished downloading;
         preloading starts them during the WASM boot instead, so they're in the HTTP cache by then.
         as="fetch" needs the crossorigin attribute to match the handler's same-origin credentials mode —
         without it the browser won't reuse the preload and downloads each font twice. -->
    <link rel="preload" href="_content/Morph.Blazor/fonts/Aptos_400.ttf" as="fetch" crossorigin />
    <link rel="preload" href="_content/Morph.Blazor/fonts/Aptos_400_Italic.ttf" as="fetch" crossorigin />
    <link rel="preload" href="_content/Morph.Blazor/fonts/Aptos_700.ttf" as="fetch" crossorigin />
    <link rel="preload" href="_content/Morph.Blazor/fonts/Aptos_700_Italic.ttf" as="fetch" crossorigin />
    <!-- The component package's stylesheet first, so this app's app.css can override anything in it. -->
    <link rel="stylesheet" href="_content/Morph.Blazor/morph.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p class="loading-message">Loading Morph...</p>
            <p class="loading-version"></p>
            <p class="loading-error" hidden></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/interop.js"></script>
    <!-- Written by the build (Morph.Web.csproj's WriteVersionScript): window.morphVersion. -->
    <script src="js/version.js"></script>
    <script>
        window.themeManager.initializeTheme();

        // The loading screen says which build it is, and why it stopped if the app cannot start: a boot
        // failure is otherwise only in the console, which a phone does not show, and the spinner turns on.
        // Once the app has rendered, the loading screen is gone and these listeners write nothing.
        (() => {
            const loading = document.querySelector('#app .loading');
            loading.querySelector('.loading-version').textContent = window.morphVersion ?? '';
            const fail = reason => {
                if (!loading.isConnected) {
                    return;
                }

                loading.classList.add('failed');
                loading.querySelector('.loading-message').textContent = 'Morph could not start';
                const error = loading.querySelector('.loading-error');
                error.textContent = String(reason?.message ?? reason ?? 'Unknown error');
                error.hidden = false;
            };
            addEventListener('error', event => fail(event.error ?? event.message));
            addEventListener('unhandledrejection', event => fail(event.reason));

            if (typeof WebAssembly !== 'object') {
                fail('This browser has WebAssembly turned off, and Morph runs on it. On an iPhone or iPad, Lockdown Mode turns it off.');
                return;
            }

            Blazor.start().catch(fail);
        })();
    </script>
</body>

</html>
