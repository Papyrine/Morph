<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p style="line-height: 1.16"><span style="font-size: 12pt;">Numbered list:</span></p>
<ol>
  <li><span style="font-size: 12pt;">First item</span></li>
  <li><span style="font-size: 12pt;">Second item</span></li>
  <li><span style="font-size: 12pt;">Third item</span></li>
  <li><span style="font-size: 12pt;">Fourth item</span></li>
  <li><span style="font-size: 12pt;">Fifth item</span></li>
</ol>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Interrupted, then continues:</span></p>
<ol start="6">
  <li><span style="font-size: 12pt;">Sixth item</span></li>
  <li><span style="font-size: 12pt;">Seventh item</span></li>
</ol>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Second list (restarts at 1):</span></p>
<ol>
  <li><span style="font-size: 12pt;">Alpha</span></li>
  <li><span style="font-size: 12pt;">Beta</span></li>
  <li><span style="font-size: 12pt;">Gamma</span></li>
</ol>
</body>
</html>
