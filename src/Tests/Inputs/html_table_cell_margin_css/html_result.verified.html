<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif">
<table>
  <tbody>
    <tr>
      <td style="border-top: 0.75pt solid #000000; border-left: 0.75pt solid #000000">Margin 10px, Padding 5px</td>
      <td style="border-top: 0.75pt solid #000000; border-right: 0.75pt solid #000000">Left margin 20px</td>
    </tr>
    <tr>
      <td style="border-bottom: 0.75pt solid #000000; border-left: 0.75pt solid #000000">Top/bottom margin</td>
      <td style="border-right: 0.75pt solid #000000; border-bottom: 0.75pt solid #000000">Default</td>
    </tr>
  </tbody>
</table>
</body>
</html>
