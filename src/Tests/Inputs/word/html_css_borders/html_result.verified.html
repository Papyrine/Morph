<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
/* Sizes only. Word's BUILT-IN Heading 4/6 are italic, but the document's own style decides:
   an italic one reaches us as italic runs, which emit <em>. Asserting it here instead
   forced italic onto every h4/h6 whose style is upright — of the 12 corpus scenarios using
   Heading 4, not one declares italic. Bold is different: it IS asserted here, and the run
   writer suppresses <strong> in a heading to match (an explicitly non-bold run still emits
   font-weight: normal). */
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
/* border-box because w:tcW is the whole cell, its side margins included. Read as the
   content box, every column with a declared width came out wider than Word's by its
   padding: html_table_styled's 75pt column measured 91pt. */
td, th { padding: 4pt 7pt; vertical-align: top; box-sizing: border-box; }
/* w:tblHeader marks a row for repetition, not styling — any real bold/centring arrives on
   the runs and cells. Without this, the browser's th defaults bolded and centred header
   cells Word renders regular and left-aligned. */
th { font-weight: inherit; text-align: inherit; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
header.doc-header { border-bottom: 0.75pt solid #a0a0a0; margin: 0 0 12pt; padding: 0 0 6pt; }
footer.doc-footer { border-top: 0.75pt solid #a0a0a0; margin: 12pt 0 0; padding: 6pt 0 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif; max-width: 468pt; padding: 72pt">
<p style="margin-bottom: 14pt; line-height: 1"><span style="font-size: 12pt;">CSS border properties:</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border: 0.75pt solid #000000; padding: 4pt"><span style="font-size: 12pt;">Thin solid black border</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border: 1.5pt solid #ff0000; padding: 4pt"><span style="font-size: 12pt;">Thicker red border</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border: 2.25pt dashed #0000ff; padding: 4pt"><span style="font-size: 12pt;">Dashed blue border</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border: 1.5pt dotted #008000; padding: 4pt"><span style="font-size: 12pt;">Dotted green border</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border: 3pt double #800080; padding: 4pt"><span style="font-size: 12pt;">Double purple border</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border-top: 1.5pt solid #ff0000; border-bottom: 1.5pt solid #0000ff; padding: 4pt 0pt"><span style="font-size: 12pt;">Top red, bottom blue borders</span></p>
<p style="margin-bottom: 14pt; line-height: 1; border-left: 3.75pt solid #ffa500; padding: 0pt 0pt 0pt 8pt"><span style="font-size: 12pt;">Left border only</span></p>
<table style="margin-left: -6.75pt">
  <tbody>
    <tr>
      <td style="padding: 6pt;border: 1.5pt solid #000000"><p style="margin: 0pt 0 8pt"><span style="font-family: Calibri, sans-serif; font-size: 12pt;">Cell with thick border</span></p></td>
      <td style="padding: 6pt;border: 0.75pt solid #808080"><p style="margin: 0pt 0 8pt"><span style="font-family: Calibri, sans-serif; font-size: 12pt;">Cell with thin border</span></p></td>
    </tr>
  </tbody>
</table>
</body>
</html>
