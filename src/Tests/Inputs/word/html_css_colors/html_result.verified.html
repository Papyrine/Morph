<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
/* Sizes only. Word's BUILT-IN Heading 4/6 are italic, but the document's own style decides:
   an italic one reaches us as italic runs, which emit <em>. Asserting it here instead
   forced italic onto every h4/h6 whose style is upright — of the 12 corpus scenarios using
   Heading 4, not one declares italic. Bold is different: it IS asserted here, and the run
   writer suppresses <strong> in a heading to match (an explicitly non-bold run still emits
   font-weight: normal). */
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
/* w:tblHeader marks a row for repetition, not styling — any real bold/centring arrives on
   the runs and cells. Without this, the browser's th defaults bolded and centred header
   cells Word renders regular and left-aligned. */
th { font-weight: inherit; text-align: inherit; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
header.doc-header { border-bottom: 0.75pt solid #a0a0a0; margin: 0 0 12pt; padding: 0 0 6pt; }
footer.doc-footer { border-top: 0.75pt solid #a0a0a0; margin: 12pt 0 0; padding: 6pt 0 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif; max-width: 468pt; padding: 72pt">
<p style="margin-bottom: 14pt; line-height: 1"><span style="font-size: 12pt;">CSS color properties:</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #ff0000; font-size: 12pt;">Named color: red</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #0000ff; font-size: 12pt;">Named color: blue</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #008000; font-size: 12pt;">Named color: green</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #ffa500; font-size: 12pt;">Named color: orange</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #800080; font-size: 12pt;">Named color: purple</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #ff5733; font-size: 12pt;">Hex color: #FF5733</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #333333; font-size: 12pt;">Short hex: #333</span></p>
<p style="margin-bottom: 14pt; line-height: 1"><span style="color: #6495ed; font-size: 12pt;">RGB: rgb(100, 149, 237) - Cornflower Blue</span></p>
<p style="margin-bottom: 14pt; line-height: 1; background-color: #ffffcc"><span style="font-size: 12pt;">Light yellow background</span></p>
<p style="margin-bottom: 14pt; line-height: 1; background-color: #d3d3d3"><span style="color: #00008b; font-size: 12pt;">Light gray bg, dark blue text</span></p>
<p style="margin-bottom: 14pt; line-height: 1; background-color: #e0e0e0"><span style="color: #333333; font-size: 12pt;">Div with background and padding</span></p>
</body>
</html>
