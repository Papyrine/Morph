<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
/* Sizes only. Word's BUILT-IN Heading 4/6 are italic, but the document's own style decides:
   an italic one reaches us as italic runs, which emit <em>. Asserting it here instead
   forced italic onto every h4/h6 whose style is upright — of the 12 corpus scenarios using
   Heading 4, not one declares italic. Bold is different: it IS asserted here, and the run
   writer suppresses <strong> in a heading to match (an explicitly non-bold run still emits
   font-weight: normal). */
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
/* w:tblHeader marks a row for repetition, not styling — any real bold/centring arrives on
   the runs and cells. Without this, the browser's th defaults bolded and centred header
   cells Word renders regular and left-aligned. */
th { font-weight: inherit; text-align: inherit; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
header.doc-header { border-bottom: 0.75pt solid #a0a0a0; margin: 0 0 12pt; padding: 0 0 6pt; }
footer.doc-footer { border-top: 0.75pt solid #a0a0a0; margin: 12pt 0 0; padding: 6pt 0 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif; max-width: 468pt; padding: 72pt">
<p style="margin-bottom: 14pt">CSS margin and padding:</p>
<p style="margin-bottom: 14pt; margin-left: 37.5pt">Paragraph with 50px left margin</p>
<p style="margin-bottom: 14pt; margin-left: 75pt">Paragraph with 100px left margin</p>
<p style="margin-top: 15pt; margin-bottom: 15pt; margin-left: 15pt; margin-right: 15pt; background-color: #eeeeee">Paragraph with 20px margin all around</p>
<p style="margin-bottom: 14pt; background-color: #dddddd">Content inside padded div</p>
<p style="margin-bottom: 14pt; border: 0.75pt solid #0066cc; padding: 11pt; background-color: #cce5ff">Paragraph with 15px padding and visible background</p>
<p style="margin-top: 22.5pt; margin-bottom: 22.5pt">Paragraph with extra vertical margins</p>
<table style="margin-left: -2.25pt; border-collapse: separate; border-spacing: 1.5pt; border: 0.75pt solid #000000">
  <tbody>
    <tr>
      <td style="padding: 20pt;border: 0.75pt solid #000000"><span style="font-family: Aptos, sans-serif;">Centered table with padded cell</span></td>
    </tr>
  </tbody>
</table>
</body>
</html>
