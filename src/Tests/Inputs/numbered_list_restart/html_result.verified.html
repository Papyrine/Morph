<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p style="line-height: 1.16"><span style="font-size: 12pt;">List A (numId=1, starts at 1):</span></p>
<ol>
  <li><span style="font-size: 12pt;">Apple</span></li>
  <li><span style="font-size: 12pt;">Banana</span></li>
  <li><span style="font-size: 12pt;">Cherry</span></li>
</ol>
<p style="line-height: 1.16"><span style="font-size: 12pt;">List B (numId=2, same abstractNum, restarts at 1 via startOverride):</span></p>
<ol>
  <li><span style="font-size: 12pt;">Dog</span></li>
  <li><span style="font-size: 12pt;">Eagle</span></li>
  <li><span style="font-size: 12pt;">Fox</span></li>
</ol>
<p style="line-height: 1.16"><span style="font-size: 12pt;">List C (numId=3, starts at 10 via startOverride):</span></p>
<ol start="10">
  <li><span style="font-size: 12pt;">Red</span></li>
  <li><span style="font-size: 12pt;">Green</span></li>
  <li><span style="font-size: 12pt;">Blue</span></li>
</ol>
</body>
</html>
