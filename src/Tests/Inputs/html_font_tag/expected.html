<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Calibri, sans-serif; font-size:11pt">
<p style="margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">HTML font tag (legacy but supported):</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:7.5pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 1 (smallest)</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:10pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 2</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 3 (default)</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:13.5pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 4</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:18pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 5</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:24pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 6</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:36pt">
<span style="font-family:'Times New Roman', sans-serif">Font size 7 (largest)</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif; color:#ff0000">Red text</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif; color:#0000ff">Blue text using hex</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:Arial, sans-serif">Arial font</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">Times New Roman font</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Courier New', sans-serif">Courier New font</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:18pt">
<span style="font-family:Georgia, sans-serif; color:#800080">Combined: size 5, purple, Georgia</span>
</p>
</body>
</html>
