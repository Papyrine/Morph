<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif">
<p>HTML font tag (legacy but supported):</p>
<p><span style="font-size: 8pt;">Font size 1 (smallest)</span></p>
<p><span style="font-size: 10pt;">Font size 2</span></p>
<p><span style="font-size: 12pt;">Font size 3 (default)</span></p>
<p><span style="font-size: 14pt;">Font size 4</span></p>
<p><span style="font-size: 18pt;">Font size 5</span></p>
<p><span style="font-size: 24pt;">Font size 6</span></p>
<p><span style="font-size: 36pt;">Font size 7 (largest)</span></p>
<p><span style="color: #ff0000;">Red text</span></p>
<p><span style="color: #0000ff;">Blue text using hex</span></p>
<p><span style="font-family: Arial;">Arial font</span></p>
<p>Times New Roman font</p>
<p><span style="font-family: 'Courier New';">Courier New font</span></p>
<p><span style="font-family: Georgia; color: #800080; font-size: 18pt;">Combined: size 5, purple, Georgia</span></p>
</body>
</html>
