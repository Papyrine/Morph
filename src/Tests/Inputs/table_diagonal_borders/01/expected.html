<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Aptos, sans-serif; font-size:10pt">
<p>
Diagonal cell borders (tl2br &amp; tr2bl):
</p>
<table cellspacing="0" cellpadding="0" style="width:451pt; border:1pt solid #000000; border-collapse:collapse">
<tr style="height:40pt">
<td style="width:149pt; border-right-style:solid; border-right-width:1pt; vertical-align:top">
<p style="font-size:10pt">
tl2br
</p>
</td>
<td style="width:149pt; border-right-style:solid; border-right-width:1pt; border-left-style:solid; border-left-width:1pt; vertical-align:top">
<p style="font-size:10pt">
tr2bl
</p>
</td>
<td style="width:149pt; border-left-style:solid; border-left-width:1pt; vertical-align:top">
<p style="font-size:10pt">
both
</p>
</td>
</tr>
</table>
<p>
&#xa0;
</p>
</body>
</html>
