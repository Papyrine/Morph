<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p style="line-height: 12pt"><span style="font-size: 12pt;">Exactly 12pt line spacing. Each line is exactly 12 points tall regardless of font size.</span></p>
<p style="line-height: 18pt"><span style="font-size: 12pt;">Exactly 18pt line spacing. This has more space between lines.</span></p>
<p style="line-height: 24pt"><span style="font-size: 12pt;">Exactly 24pt line spacing. Even more space, but text may clip if font is larger.</span></p>
<p style="line-height: 36pt"><span style="font-size: 12pt;">Exactly 36pt line spacing. Large fixed spacing between lines.</span></p>
</body>
</html>
