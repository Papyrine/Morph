<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
/* Sizes only. Word's BUILT-IN Heading 4/6 are italic, but the document's own style decides:
   an italic one reaches us as italic runs, which emit <em>. Asserting it here instead
   forced italic onto every h4/h6 whose style is upright — of the 12 corpus scenarios using
   Heading 4, not one declares italic. Bold is different: it IS asserted here, and the run
   writer suppresses <strong> in a heading to match (an explicitly non-bold run still emits
   font-weight: normal). */
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
header.doc-header { border-bottom: 0.75pt solid #a0a0a0; margin: 0 0 12pt; padding: 0 0 6pt; }
footer.doc-footer { border-top: 0.75pt solid #a0a0a0; margin: 12pt 0 0; padding: 6pt 0 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p style="line-height: 1.16"><span style="font-size: 12pt;">Tab stops demo</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Chapter 1: Introduction</span> <span style="font-size: 12pt;">1</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Chapter 2: Background and motivation</span> <span style="font-size: 12pt;">12</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Chapter 3: Implementation</span> <span style="font-size: 12pt;">147</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Name</span> <span style="font-size: 12pt;">Role</span> <span style="font-size: 12pt;">Team</span> <span style="font-size: 12pt;">Location</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Alice</span> <span style="font-size: 12pt;">Engineer</span> <span style="font-size: 12pt;">Platform</span> <span style="font-size: 12pt;">Sydney</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Bob</span> <span style="font-size: 12pt;">Designer</span> <span style="font-size: 12pt;">Product</span> <span style="font-size: 12pt;">Remote</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Default tabs (0.5&quot;):</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">A</span> <span style="font-size: 12pt;">B</span> <span style="font-size: 12pt;">C</span> <span style="font-size: 12pt;">D</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Left</span> <span style="font-size: 12pt;">Centered</span> <span style="font-size: 12pt;">Right</span></p>
<p style="line-height: 1.16"><span style="font-size: 12pt;">Signature</span> </p>
</body>
</html>
