<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif; max-width: 468pt; padding: 72pt">
<h1 id="heading-1-largest" style="font-size: 24pt; margin-top: 0pt; margin-bottom: 12pt">Heading 1 - Largest</h1>
<p>Paragraph after heading 1.</p>
<h2 id="heading-2" style="font-size: 18pt; margin-top: 0pt; margin-bottom: 12pt">Heading 2</h2>
<p>Paragraph after heading 2.</p>
<h3 id="heading-3" style="font-size: 14pt; margin-top: 0pt; margin-bottom: 8pt">Heading 3</h3>
<p>Paragraph after heading 3.</p>
<h4 id="heading-4" style="font-size: 12pt; margin-top: 0pt; margin-bottom: 8pt">Heading 4</h4>
<p>Paragraph after heading 4.</p>
<h5 id="heading-5" style="margin-top: 0pt; margin-bottom: 8pt">Heading 5</h5>
<p>Paragraph after heading 5.</p>
<h6 id="heading-6-smallest" style="font-size: 10pt; margin-top: 0pt; margin-bottom: 8pt">Heading 6 - Smallest</h6>
<p>Paragraph after heading 6.</p>
</body>
</html>
