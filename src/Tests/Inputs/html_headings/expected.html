<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Calibri; font-size:11pt">
<h1 style="margin-top:0pt; margin-bottom:14pt; line-height:normal; font-size:24pt">
<span style="font-family:'Times New Roman'">Heading 1 - Largest</span>
</h1>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Paragraph after heading 1.</span>
</p>
<h2 style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:18pt">
<span style="font-family:'Times New Roman'">Heading 2</span>
</h2>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Paragraph after heading 2.</span>
</p>
<h3 style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:13.5pt">
<span style="font-family:'Times New Roman'">Heading 3</span>
</h3>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Paragraph after heading 3.</span>
</p>
<h4 style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Heading 4</span>
</h4>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Paragraph after heading 4.</span>
</p>
<h5 style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:10pt">
<span style="font-family:'Times New Roman'">Heading 5</span>
</h5>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Paragraph after heading 5.</span>
</p>
<h6 style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:7.5pt">
<span style="font-family:'Times New Roman'">Heading 6 - Smallest</span>
</h6>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman'">Paragraph after heading 6.</span>
</p>
</body>
</html>
