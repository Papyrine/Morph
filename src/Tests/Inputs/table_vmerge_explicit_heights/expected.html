<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Calibri, sans-serif; font-size:11pt">
<p>
Table with vMerge AND Explicit Heights
</p>
<table cellspacing="0" cellpadding="0" style="width:100%; border-collapse:collapse">
<tr style="height:150pt">
<td rowspan="3" style="padding-right:0.5pt; padding-left:0.5pt; vertical-align:top">
<p style="font-size:11pt">
Merged
</p>
<p style="font-size:11pt">
(150pt total)
</p>
</td>
<td style="padding-right:0.5pt; padding-left:0.5pt; vertical-align:top">
<p style="font-size:11pt">
Row 1 Right (150pt)
</p>
</td>
</tr>
<tr style="height:100pt">
<td style="padding-right:0.5pt; padding-left:0.5pt; vertical-align:top">
<p style="font-size:11pt">
Row 2 Right (100pt)
</p>
</td>
</tr>
<tr style="height:50pt">
<td style="padding-right:0.5pt; padding-left:0.5pt; vertical-align:top">
<p style="font-size:11pt">
Row 3 Right (50pt)
</p>
</td>
</tr>
</table>
<p>
Total merged cell height should be 300pt (150+100+50)
</p>
</body>
</html>
