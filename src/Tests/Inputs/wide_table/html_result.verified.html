<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p style="line-height: 1.16"><span style="font-size: 12pt;">Wide table with 6 columns:</span></p>
<table>
  <tbody>
    <tr>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">Col 1</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">Col 2</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">Col 3</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">Col 4</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">Col 5</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">Col 6</span></td>
    </tr>
    <tr>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R1C1</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R1C2</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R1C3</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R1C4</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R1C5</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R1C6</span></td>
    </tr>
    <tr>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R2C1</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R2C2</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R2C3</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R2C4</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R2C5</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R2C6</span></td>
    </tr>
    <tr>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R3C1</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R3C2</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R3C3</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R3C4</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R3C5</span></td>
      <td style="border: 0.5pt solid #000000"><span style="font-size: 12pt;">R3C6</span></td>
    </tr>
  </tbody>
</table>
</body>
</html>
