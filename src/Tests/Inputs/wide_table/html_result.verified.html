<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt 72pt 72pt 72pt">
<p>Wide table with 6 columns:</p>
<table>
  <tbody>
    <tr>
      <td style="border: 0.5pt solid #000000">Col 1</td>
      <td style="border: 0.5pt solid #000000">Col 2</td>
      <td style="border: 0.5pt solid #000000">Col 3</td>
      <td style="border: 0.5pt solid #000000">Col 4</td>
      <td style="border: 0.5pt solid #000000">Col 5</td>
      <td style="border: 0.5pt solid #000000">Col 6</td>
    </tr>
    <tr>
      <td style="border: 0.5pt solid #000000">R1C1</td>
      <td style="border: 0.5pt solid #000000">R1C2</td>
      <td style="border: 0.5pt solid #000000">R1C3</td>
      <td style="border: 0.5pt solid #000000">R1C4</td>
      <td style="border: 0.5pt solid #000000">R1C5</td>
      <td style="border: 0.5pt solid #000000">R1C6</td>
    </tr>
    <tr>
      <td style="border: 0.5pt solid #000000">R2C1</td>
      <td style="border: 0.5pt solid #000000">R2C2</td>
      <td style="border: 0.5pt solid #000000">R2C3</td>
      <td style="border: 0.5pt solid #000000">R2C4</td>
      <td style="border: 0.5pt solid #000000">R2C5</td>
      <td style="border: 0.5pt solid #000000">R2C6</td>
    </tr>
    <tr>
      <td style="border: 0.5pt solid #000000">R3C1</td>
      <td style="border: 0.5pt solid #000000">R3C2</td>
      <td style="border: 0.5pt solid #000000">R3C3</td>
      <td style="border: 0.5pt solid #000000">R3C4</td>
      <td style="border: 0.5pt solid #000000">R3C5</td>
      <td style="border: 0.5pt solid #000000">R3C6</td>
    </tr>
  </tbody>
</table>
</body>
</html>
