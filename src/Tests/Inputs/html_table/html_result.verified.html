<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif; max-width: 468pt; padding: 72pt">
<p>Basic HTML table:</p>
<table>
  <tbody>
    <tr>
      <td style="border-top: 0.5pt solid #000000; border-left: 0.5pt solid #000000"><strong>Header 1</strong></td>
      <td style="border-top: 0.5pt solid #000000"><strong>Header 2</strong></td>
      <td style="border-top: 0.5pt solid #000000; border-right: 0.5pt solid #000000"><strong>Header 3</strong></td>
    </tr>
    <tr>
      <td style="border-left: 0.5pt solid #000000">Row 1, Cell 1</td>
      <td>Row 1, Cell 2</td>
      <td style="border-right: 0.5pt solid #000000">Row 1, Cell 3</td>
    </tr>
    <tr>
      <td style="border-left: 0.5pt solid #000000">Row 2, Cell 1</td>
      <td>Row 2, Cell 2</td>
      <td style="border-right: 0.5pt solid #000000">Row 2, Cell 3</td>
    </tr>
    <tr>
      <td style="border-bottom: 0.5pt solid #000000; border-left: 0.5pt solid #000000">Row 3, Cell 1</td>
      <td style="border-bottom: 0.5pt solid #000000">Row 3, Cell 2</td>
      <td style="border-right: 0.5pt solid #000000; border-bottom: 0.5pt solid #000000">Row 3, Cell 3</td>
    </tr>
  </tbody>
</table>
</body>
</html>
