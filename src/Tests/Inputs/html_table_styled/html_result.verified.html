<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
/* Sizes only. Word's BUILT-IN Heading 4/6 are italic, but the document's own style decides:
   an italic one reaches us as italic runs, which emit <em>. Asserting it here instead
   forced italic onto every h4/h6 whose style is upright — of the 12 corpus scenarios using
   Heading 4, not one declares italic. Bold is different: it IS asserted here, and the run
   writer suppresses <strong> in a heading to match (an explicitly non-bold run still emits
   font-weight: normal). */
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
header.doc-header { border-bottom: 0.75pt solid #a0a0a0; margin: 0 0 12pt; padding: 0 0 6pt; }
footer.doc-footer { border-top: 0.75pt solid #a0a0a0; margin: 12pt 0 0; padding: 6pt 0 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif; max-width: 468pt; padding: 72pt">
<p style="margin-bottom: 14pt">Styled HTML table with borders and colors:</p>
<table>
  <tbody>
    <tr>
      <td style="background-color: #4472c4; border-top: 0.75pt solid #b2b2b2; border-left: 0.75pt solid #b2b2b2"><span style="color: #ffffff;"><strong>Name</strong></span></td>
      <td style="background-color: #4472c4; border-top: 0.75pt solid #b2b2b2; text-align: center"><span style="color: #ffffff;"><strong>Age</strong></span></td>
      <td style="background-color: #4472c4; border-top: 0.75pt solid #b2b2b2; border-right: 0.75pt solid #b2b2b2; text-align: right"><span style="color: #ffffff;"><strong>Salary</strong></span></td>
    </tr>
    <tr>
      <td style="background-color: #d9e2f3; border-left: 0.75pt solid #b2b2b2">John Doe</td>
      <td style="background-color: #d9e2f3; text-align: center">30</td>
      <td style="background-color: #d9e2f3; border-right: 0.75pt solid #b2b2b2; text-align: right">$50,000</td>
    </tr>
    <tr>
      <td style="border-left: 0.75pt solid #b2b2b2">Jane Smith</td>
      <td style="text-align: center">25</td>
      <td style="border-right: 0.75pt solid #b2b2b2; text-align: right">$45,000</td>
    </tr>
    <tr>
      <td style="background-color: #d9e2f3; border-bottom: 0.75pt solid #b2b2b2; border-left: 0.75pt solid #b2b2b2">Bob Johnson</td>
      <td style="background-color: #d9e2f3; border-bottom: 0.75pt solid #b2b2b2; text-align: center">35</td>
      <td style="background-color: #d9e2f3; border-right: 0.75pt solid #b2b2b2; border-bottom: 0.75pt solid #b2b2b2; text-align: right">$60,000</td>
    </tr>
  </tbody>
</table>
<p style="margin-bottom: 14pt">Table with fixed column widths:</p>
<table>
  <tbody>
    <tr>
      <td style="width: 100pt; border-top: 0.75pt solid #b2b2b2; border-bottom: 0.75pt solid #b2b2b2; border-left: 0.75pt solid #b2b2b2">Fixed 100px</td>
      <td style="width: 200pt; border-top: 0.75pt solid #b2b2b2; border-bottom: 0.75pt solid #b2b2b2">Fixed 200px</td>
      <td style="border-top: 0.75pt solid #b2b2b2; border-right: 0.75pt solid #b2b2b2; border-bottom: 0.75pt solid #b2b2b2">Flexible</td>
    </tr>
  </tbody>
</table>
</body>
</html>
