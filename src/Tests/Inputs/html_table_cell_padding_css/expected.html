<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Calibri; font-size:11pt">
<table cellspacing="2" cellpadding="0" style="border:0.75pt outset #808080; border-spacing:1.5pt">
<tr>
<td style="border:0.75pt inset #808080; padding:15pt; vertical-align:middle">
<p style="font-size:11pt">
20px all sides
</p>
</td>
<td style="border:0.75pt inset #808080; padding:22.5pt 0.75pt 3.75pt; vertical-align:middle">
<p style="font-size:11pt">
30px top, 5px bottom
</p>
</td>
</tr>
<tr>
<td style="border:0.75pt inset #808080; padding:0.75pt 0.75pt 0.75pt 30pt; vertical-align:middle">
<p style="font-size:11pt">
40px left
</p>
</td>
<td style="border:0.75pt inset #808080; padding:7.5pt 15pt; vertical-align:middle">
<p style="font-size:11pt">
10px vert, 20px horiz
</p>
</td>
</tr>
</table>
<p>
&#xa0;
</p>
</body>
</html>
