<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Calibri, sans-serif; font-size:11pt">
<p style="margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">CSS margin and padding:</span>
</p>
<p style="margin-top:14pt; margin-left:37.5pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">Paragraph with 50px left margin</span>
</p>
<p style="margin-top:14pt; margin-left:75pt; margin-bottom:14pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">Paragraph with 100px left margin</span>
</p>
<p style="margin:15pt; line-height:normal; font-size:12pt; background-color:#eeeeee">
<span style="font-family:'Times New Roman', sans-serif">Paragraph with 20px margin all around</span>
</p>
<p style="margin-bottom:0pt; line-height:normal; font-size:12pt; background-color:#dddddd">
<span style="font-family:'Times New Roman', sans-serif">Content inside padded div</span>
</p>
<p style="margin-top:14pt; margin-bottom:14pt; line-height:normal; border:0.75pt solid #0066cc; padding:11pt; font-size:12pt; background-color:#cce5ff">
<span style="font-family:'Times New Roman', sans-serif">Paragraph with 15px padding and visible background </span>
</p>
<p style="margin-top:22.5pt; margin-bottom:22.5pt; line-height:normal; font-size:12pt">
<span style="font-family:'Times New Roman', sans-serif">Paragraph with extra vertical margins</span>
</p>
<div style="text-align:center">
<table cellspacing="2" cellpadding="0" style="margin-right:auto; margin-left:auto; border:0.75pt solid #000000; border-spacing:1.5pt">
<tr>
<td style="padding:15pt; vertical-align:middle">
<p style="font-size:11pt">
Centered table with padded cell
</p>
</td>
</tr>
</table>
</div>
<p>
&#xa0;
</p>
</body>
</html>
