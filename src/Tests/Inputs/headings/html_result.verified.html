<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p><span style="font-size: 24pt;"><strong>Heading 1 Style</strong></span></p>
<p>Normal paragraph under heading 1.</p>
<p><span style="font-size: 18pt;"><strong>Heading 2 Style</strong></span></p>
<p>Normal paragraph under heading 2.</p>
<p><span style="font-size: 14pt;"><strong>Heading 3 Style</strong></span></p>
<p>Normal paragraph under heading 3.</p>
<p><span style="font-size: 12pt;"><strong><em>Heading 4 Style</em></strong></span></p>
<p>Normal paragraph under heading 4.</p>
</body>
</html>
