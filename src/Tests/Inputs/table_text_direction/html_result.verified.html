<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
header.doc-header { border-bottom: 0.75pt solid #a0a0a0; margin: 0 0 12pt; padding: 0 0 6pt; }
footer.doc-footer { border-top: 0.75pt solid #a0a0a0; margin: 12pt 0 0; padding: 6pt 0 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p style="margin-bottom: 0pt"><span style="font-size: 12pt;">Quarterly results:</span></p>
<table>
  <tbody>
    <tr style="height: 90pt">
      <td style="width: 36pt; border: 0.5pt solid #000000"><span style="font-size: 12pt;">Quarter</span></td>
      <td style="width: 150pt; border: 0.5pt solid #000000"><span style="font-size: 12pt;">Region</span></td>
    </tr>
    <tr style="height: 40pt">
      <td style="width: 36pt; border: 0.5pt solid #000000"><span style="font-size: 12pt;">Q1</span></td>
      <td style="width: 150pt; border: 0.5pt solid #000000"><span style="font-size: 12pt;">North</span></td>
    </tr>
    <tr style="height: 40pt">
      <td style="width: 36pt; border: 0.5pt solid #000000"><span style="font-size: 12pt;">Q2</span></td>
      <td style="width: 150pt; border: 0.5pt solid #000000"><span style="font-size: 12pt;">South</span></td>
    </tr>
  </tbody>
</table>
</body>
</html>
