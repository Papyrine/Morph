<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; clear: both; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p>Table with colored header:</p>
<table>
  <tbody>
    <tr>
      <td style="background-color: #4472c4; border: 0.5pt solid #000000"><span style="color: #ffffff;"><strong>Header 1</strong></span></td>
      <td style="background-color: #4472c4; border: 0.5pt solid #000000"><span style="color: #ffffff;"><strong>Header 2</strong></span></td>
      <td style="background-color: #4472c4; border: 0.5pt solid #000000"><span style="color: #ffffff;"><strong>Header 3</strong></span></td>
    </tr>
    <tr>
      <td style="background-color: #d9e2f3; border: 0.5pt solid #000000">Data 1-1</td>
      <td style="background-color: #d9e2f3; border: 0.5pt solid #000000">Data 1-2</td>
      <td style="background-color: #d9e2f3; border: 0.5pt solid #000000">Data 1-3</td>
    </tr>
    <tr>
      <td style="background-color: #ffffff; border: 0.5pt solid #000000">Data 2-1</td>
      <td style="background-color: #ffffff; border: 0.5pt solid #000000">Data 2-2</td>
      <td style="background-color: #ffffff; border: 0.5pt solid #000000">Data 2-3</td>
    </tr>
    <tr>
      <td style="background-color: #d9e2f3; border: 0.5pt solid #000000">Data 3-1</td>
      <td style="background-color: #d9e2f3; border: 0.5pt solid #000000">Data 3-2</td>
      <td style="background-color: #d9e2f3; border: 0.5pt solid #000000">Data 3-3</td>
    </tr>
  </tbody>
</table>
</body>
</html>
