<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="line-height:108%; font-family:Calibri, sans-serif; font-size:11pt">
<p>
Two-Column Layout Table
</p>

<tr>
<td style="width:50%; border-right-style:solid; border-right-width:0.75pt; padding-right:0.12pt; padding-left:0.12pt; vertical-align:top">
<p style="font-size:11pt">
Left Column
</p>
<p style="font-size:11pt">
&#xa0;
</p>
<p style="font-size:11pt">
This is shorter content.
</p>
</td>
<td style="width:50%; border-left-style:solid; border-left-width:0.75pt; padding-right:0.12pt; padding-left:0.12pt; vertical-align:top">
<p style="font-size:11pt">
Right Column
</p>
<p style="font-size:11pt">
&#xa0;
</p>
<p style="font-size:11pt">
This column has much more content.
</p>
<p style="font-size:11pt">
&#xa0;
</p>

<p style="font-size:11pt">

</p>
<p style="font-size:11pt">

<p style="font-size:11pt">

</p>
<p style="font-size:11pt">
Line 5
</p>
<p style="font-size:11pt">
Line 6
</p>
<p style="font-size:11pt">
Line 7
</p>
<p style="font-size:11pt">
Line 8
</p>
<p style="font-size:11pt">
Line 9
</p>
<p style="font-size:11pt">
Line 10
</p>
</td>
</tr>
</table>
<p>
&#xa0;
</p>
</body>
</html>
