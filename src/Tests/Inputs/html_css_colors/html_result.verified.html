<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; padding: 8pt; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 8pt; font-weight: bold; }
h1 { font-size: 24pt; }
h2 { font-size: 18pt; }
h3 { font-size: 14pt; }
h4 { font-size: 12pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: 'Times New Roman', sans-serif">
<p>CSS color properties:</p>
<p><span style="color: #ff0000;">Named color: red</span></p>
<p><span style="color: #0000ff;">Named color: blue</span></p>
<p><span style="color: #008000;">Named color: green</span></p>
<p><span style="color: #ffa500;">Named color: orange</span></p>
<p><span style="color: #800080;">Named color: purple</span></p>
<p><span style="color: #ff5733;">Hex color: #FF5733</span></p>
<p><span style="color: #333333;">Short hex: #333</span></p>
<p><span style="color: #6495ed;">RGB: rgb(100, 149, 237) - Cornflower Blue</span></p>
<p>Light yellow background</p>
<p>Light gray bg, dark blue text</p>
<p><span style="color: #333333;">Div with background and padding</span></p>
</body>
</html>
