<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Calibri, sans-serif; font-size: 11pt; line-height: 1.08; margin: 0; color: #000; }
p { margin: 0 0 8pt; }
h1, h2, h3, h4, h5, h6 { margin: 12pt 0 0; font-weight: bold; }
h1 { font-size: 16pt; }
h2 { font-size: 13pt; }
h3 { font-size: 12pt; }
h4 { font-size: 11pt; font-style: italic; }
h5 { font-size: 11pt; }
h6 { font-size: 11pt; font-style: italic; }
ul, ol { margin: 0 0 8pt; padding-left: 24pt; }
li { margin: 0; }
table { border-collapse: collapse; margin: 0 0 8pt; }
td, th { padding: 4pt 7pt; vertical-align: top; }
hr { border: 0; border-top: 0.75pt solid #a0a0a0; margin: 6pt 0; }
</style>
</head>
<body style="font-family: Aptos, sans-serif; max-width: 468pt; padding: 72pt">
<p>Normal paragraph with no indent.</p>
<p style="margin-left: 36pt">This paragraph is indented 0.5 inches from the left margin.</p>
<p style="margin-left: 72pt">This paragraph is indented 1 inch from the left margin.</p>
<p>Back to normal paragraph.</p>
</body>
</html>
